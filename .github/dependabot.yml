version: 2
updates:
  # Enable version updates for npm
  # npm, not bun, DELIBERATELY. Dependabot parses only bun.lock lockfileVersion 1 and Bun
  # writes 2, so every bun updater run failed with "Unsupported bun.lock lockfileVersion 2"
  # and NO dependency update was proposed for this repo since the Bun migration. Security
  # alerts kept working (dependency-graph based); automated remediation is what was dead.
  #
  # No package-lock.json is committed, so npm updates package.json ranges only and bun.lock
  # stays authoritative -- regenerated by `bun install`, never by Dependabot. A second
  # committed lockfile would be a second source of truth to drift.
  # Verified on fzf-mcp first: the npm updater succeeded where bun had failed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "danielsimonjr"
    assignees:
      - "danielsimonjr"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    versioning-strategy: increase
    ignore:
      # TypeScript 7 is un-adoptable until the lint toolchain supports it:
      # @typescript-eslint/eslint-plugin@8.63.0 (latest) declares
      # `peer typescript: >=4.8.4 <6.1.0`, so `npm ci` fails with ERESOLVE.
      # Remove this ignore once @typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
