name: Code Coverage

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  # Single source of truth for the coverage gate. Measured lines coverage as
  # of 2026-08-03 is ~58.1%; this is a ratchet baseline just below that so
  # the gate is real (fails the build) without being a no-op or an
  # immediately-red hard-fail. Raise this as coverage improves - never lower
  # it to make a regression pass.
  COVERAGE_THRESHOLD: 55

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          NODE_ENV: test

      - name: Generate coverage summary
        id: coverage
        run: |
          # Extract coverage percentages from coverage summary
          if [ -f coverage/coverage-summary.json ]; then
            TOTAL_COV=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
            echo "total_coverage=$TOTAL_COV" >> $GITHUB_OUTPUT
          else
            echo "total_coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-deepthinking-mcp
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
            coverage/lcov-report/
          retention-days: 30

      - name: Generate coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: deepthinking-mcp-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          valColorRange: ${{ steps.coverage.outputs.total_coverage }}
          maxColorRange: 100
          minColorRange: 0
        continue-on-error: true

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let coverageComment = '## 📊 Code Coverage Report\n\n';

            try {
              const coverageData = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverageData.total;

              coverageComment += '| Metric | Coverage | Status |\n';
              coverageComment += '|--------|----------|--------|\n';

              const metrics = [
                { name: 'Lines', data: total.lines },
                { name: 'Statements', data: total.statements },
                { name: 'Functions', data: total.functions },
                { name: 'Branches', data: total.branches }
              ];

              const threshold = Number(process.env.COVERAGE_THRESHOLD);

              metrics.forEach(metric => {
                const pct = metric.data.pct;
                const status = pct >= threshold ? '✅' : '❌';
                coverageComment += `| ${metric.name} | ${pct}% (${metric.data.covered}/${metric.data.total}) | ${status} |\n`;
              });

              coverageComment += '\n';

              // Coverage threshold check (single source of truth: COVERAGE_THRESHOLD env var)
              if (total.lines.pct < threshold) {
                coverageComment += `❌ **Below gate**: Line coverage (${total.lines.pct}%) is below the required ${threshold}% threshold\n`;
              } else {
                coverageComment += `✅ **Meets gate**: Coverage is at or above the required ${threshold}% threshold\n`;
              }

            } catch (error) {
              coverageComment += '❌ Failed to read coverage data\n';
            }

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Code Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: coverageComment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: coverageComment
              });
            }

      - name: Post coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage/coverage-summary.json ]; then
            node -pe "
              const data = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8'));
              const t = data.total;
              \`| Metric | Coverage |
              |--------|----------|
              | Lines | \${t.lines.pct}% |
              | Statements | \${t.statements.pct}% |
              | Functions | \${t.functions.pct}% |
              | Branches | \${t.branches.pct}% |

              Total Coverage: **\${t.lines.pct}%**\`
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No coverage data generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check coverage threshold
        run: |
          COVERAGE=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
          echo "Line coverage: $COVERAGE% (threshold: $COVERAGE_THRESHOLD%)"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Code coverage ($COVERAGE%) is below the required $COVERAGE_THRESHOLD% threshold"
            exit 1
          fi
