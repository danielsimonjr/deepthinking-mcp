name: Dependabot Auto-Merge

#
# MERGING WAS REMOVED 2026-09-22. This workflow now LABELS a green patch/minor PR
# "ready to merge" instead of merging it. The actor gate, the repository auto-merge
# probe and the major-bump comment are unchanged.
#
# WHY. On 2026-09-21 at 18:27 the repository owner turned auto-merge OFF by hand
# across several repos, seconds apart. That sweep is the clearest available statement
# of intent: merges are a human decision here.
#
# THIS REPO IS THE ONE THAT ALREADY HAD dependabot-bun-lock.yml, so the lockfile
# defect was already fixed here and auto-merge could genuinely fire. That makes this
# change load-bearing rather than precautionary, unlike the sibling repos where the
# frozen-lockfile bug was still acting as an accidental brake.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label patch/minor as ready to merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr edit "$PR_URL" --add-label 'ready to merge' \
            || gh pr comment "$PR_URL" --body \
              'Patch/minor Dependabot bump. Queued for a human merge once CI is green - this repo does not auto-merge.'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ This is a major version update. Please review carefully before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
