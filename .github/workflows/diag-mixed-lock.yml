name: Diagnostic mixed lock

on:
  push:
    branches: [fix/shared-lock-einval]

permissions:
  contents: read

jobs:
  diag:
    name: Mixed on macos-latest (Node ${{ matrix.node-version }}, ${{ matrix.readers }} readers, force ${{ matrix.force }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: 22.x, readers: 40, force: '0' }
          - { node-version: 22.x, readers: 120, force: '0' }
          - { node-version: 22.x, readers: 40, force: '1' }
          - { node-version: 22.x, readers: 120, force: '1' }
          - { node-version: 20.x, readers: 40, force: '0' }
          - { node-version: 20.x, readers: 120, force: '0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Mixed lock operations
        run: bunx vitest run tests/diag/mixed-lock.test.ts
        env:
          NODE_ENV: test
          DIAG_MS: '240000'
          DIAG_READERS: ${{ matrix.readers }}
          DIAG_FORCE: ${{ matrix.force }}
