name: Diagnostic shared lock

on:
  push:
    branches: [fix/shared-lock-einval]

permissions:
  contents: read

jobs:
  diag:
    name: Diag on ${{ matrix.os }} (Node ${{ matrix.node-version }}, ${{ matrix.readers }} readers, stagger ${{ matrix.stagger }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        node-version: [22.x, 20.x]
        readers: [40, 120]
        stagger: [1, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Stress the shared-lock race
        run: bunx vitest run tests/diag/shared-lock-einval.test.ts
        env:
          NODE_ENV: test
          DIAG_MS: '240000'
          DIAG_READERS: ${{ matrix.readers }}
          DIAG_STAGGER: ${{ matrix.stagger }}
