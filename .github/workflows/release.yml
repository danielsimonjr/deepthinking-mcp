name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test
        env:
          NODE_ENV: test

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  release:
    name: Attach Assets to Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Pack ONE artifact. The previous step passed `files: dist/**/*`, and GitHub FLATTENS
      # uploaded asset names: once dist/ became nested, files sharing a basename
      # (base.d.ts, critique.d.ts.map, argumentation.d.ts.map ...) raced each other into the
      # same asset name. v10.0.1 failed with "Asset X already exists (race condition)" after
      # leaving 303 assets behind, where v10.0.0 - when dist/ was still flat - produced 6.
      # The tarball cannot collide with itself, and by package.json `files` it contains exactly
      # dist/, README.md and LICENSE: the same intent v10.0.0 shipped, in one file.
      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          FILE=$(npm pack --silent)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Packed $FILE ($(stat -c%s "$FILE") bytes)"

      # ATTACH ONLY. Releases for this repo are written BY HAND and created locally, so this
      # workflow must never author or rewrite one. The old step passed name: and body:, which
      # overwrote hand-written notes with a git-log dump on v10.0.1. `gh release upload` touches
      # assets and nothing else; if the release does not exist yet we STOP rather than create a
      # release with machine-generated notes.
      - name: Attach the tarball to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.get_version.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist. This workflow ATTACHES assets; it does not create releases."
            echo "Create the release first (it is authored by hand), then re-run."
            exit 1
          fi
          gh release upload "$TAG" "${{ steps.pack.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber
          COUNT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length')
          echo "Attached ${{ steps.pack.outputs.file }}; release now has $COUNT asset(s)."

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release]
    if: always()

    steps:
      - name: Post summary
        run: |
          echo "## Release Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- npm Publish: run \`npm publish\` locally (see CLAUDE.md)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
